name: Build APK

on:
  push:
    branches: [main, 'mejoras/*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- 1) tests de TODA la carpeta tests/ (node --test, sin dependencias) ----
  # El globo tests/*.test.mjs toma los tests nuevos automáticamente.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correr la suite completa
        run: node --test tests/*.test.mjs

  # ---- 2) build Gradle (necesita que los tests estén en verde) ----
  # Orden exigido por el flujo: tests → herramientas (get-tools.sh) →
  # dependencia nativa (vendor_llama.sh) → APK firmado con Gradle.
  # Los .so del motor NO viven en Git: vendor_llama.sh clona llama.cpp y
  # Gradle lo compila con NDK + CMake dejándolas en app/src/main/jniLibs/<ABI>.
  build:
    needs: tests
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Herramientas de compilación (idempotente: el runner ya trae SDK, el
      # script completa platform 34, build-tools, NDK 27.0.12077973 y cmake).
      - name: Preparar herramientas de compilación (JDK/SDK/NDK/CMake)
        run: chmod +x scripts/get-tools.sh && ./scripts/get-tools.sh
        env:
          KIU_SKIP_JDK: '1'

      # Motor nativo: deja vendor/llama.cpp en el commit FIJADO de
      # scripts/vendor_llama.sh y Gradle lo compila con NDK + CMake inyectando
      # las .so en app/src/main/jniLibs/<ABI>.
      #
      # v2.9.2: antes clonaba `master` y el motor era una dependencia flotante
      # — un commit de upstream podía romper el build sin que cambiara nada del
      # repo. Ahora el pin está en vendor_llama.sh (una sola fuente de verdad) y
      # este step lo muestra en el log para que un fallo de compilación diga
      # CONTRA QUÉ commit fue, y se pueda reproducir.
      - name: Vendorizar llama.cpp (motor nativo desde fuente, commit fijado)
        run: |
          chmod +x scripts/vendor_llama.sh
          ./scripts/vendor_llama.sh --show
          ./scripts/vendor_llama.sh
          {
            echo "### motor nativo"
            echo '```'
            git -C vendor/llama.cpp log -1 --format='%H  %ad' --date=short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      # Firma del release: con los secretos KIU_KEYSTORE_BASE64 /
      # KIU_KEYSTORE_PASSWORD el APK sale firmado con la clave del proyecto;
      # sin ellos, con la clave debug (solo para probar).
      - name: Preparar keystore de firma
        env:
          KS: ${{ secrets.KIU_KEYSTORE_BASE64 }}
          PW: ${{ secrets.KIU_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > keystore/kiu-release.jks
            echo "KIU_PASS=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos KIU_KEYSTORE_BASE64 / KIU_KEYSTORE_PASSWORD. El APK release firma con la clave debug: sirve para probar, no para actualizar la app ya instalada."
          fi

      # v2.11.0: red de seguridad de la firma. Si los secretos están pero el keystore no abre,
      # el build corta ACÁ con el motivo en claro (y no 8 minutos después con un error de Gradle).
      # Además deja la huella SHA-256 en el resumen del run: si es la misma que en el build
      # anterior, la app se actualiza sin desinstalar.
      - name: Verificar firma
        if: env.KIU_PASS != ''
        shell: bash
        run: |
          f=keystore/kiu-release.jks
          alias="${KIU_ALIAS:-kiu}"
          if [ ! -s "$f" ]; then
            echo "::error::El keystore quedó vacío: KIU_KEYSTORE_BASE64 está mal pegado. Tiene que ser UNA línea de base64 (base64 -w0 kiu-release.jks), sin espacios ni saltos."
            exit 1
          fi
          if ! out=$(keytool -list -v -keystore "$f" -storepass "$KIU_PASS" 2>&1); then
            if echo "$out" | grep -qi "password was incorrect\|keystore was tampered"; then
              echo "::error::La contraseña KIU_KEYSTORE_PASSWORD no abre el keystore. Revisá que sea exactamente la que usaste al crearlo (sin espacios al final)."
            else
              echo "::error::El archivo no es un keystore válido: KIU_KEYSTORE_BASE64 está cortado o dañado. Generalo de nuevo con base64 -w0."
            fi
            echo "$out" | head -3
            exit 1
          fi
          if ! echo "$out" | grep -qi "Alias name: $alias"; then
            echo "::error::El keystore no tiene el alias '$alias'. Alias que sí tiene:"
            echo "$out" | grep -i "Alias name" || true
            exit 1
          fi
          fp=$(echo "$out" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "Huella SHA-256 de la firma: $fp"
          {
            echo "### Firma del APK"
            echo ""
            echo "Huella SHA-256: \`$fp\`"
            echo ""
            echo "Si es la misma que en el build anterior, la app se actualiza sin desinstalar."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests Node (incluye el Java que se ejecuta de verdad)
        shell: bash
        run: |
          # El runner de GitHub ya trae un JDK, así que tests/java.test.mjs
          # EJECUTA Backoff en vez de solo leerlo con regex. Acá corre siempre.
          java -version
          node --test tests/*.test.mjs

      - name: Tests de la app (JUnit, si hay)
        shell: bash
        run: |
          # v2.9.5: la capa Java no tenia NI UN test — 4.900 lineas sin cobertura, y
          # ahi viven los tres bugs de audio que se reportaban. Todavia no hay
          # fuentes en app/src/test, asi que esto es un no-op que pasa; queda el
          # cableado listo para cuando se agreguen, y el CI no arranca el build
          # de un APK con tests rojos.
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain || {
            echo "::error::Los tests de app/src/test fallaron: no se publica el APK"
            exit 1
          }

      - name: Compilar (debug + release firmado)
        shell: bash
        run: |
          # Reintenta la descarga del wrapper de Gradle (fallo puntual de DNS en el runner)
          for i in 1 2 3; do ./gradlew --version --no-daemon && break || sleep 15; done
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      # Si falla: saca el error REAL (compilador C++/Gradle) al resumen del run,
      # para no tener que buscarlo entre cientos de líneas de stack trace.
      - name: Mostrar el error real
        if: failure()
        shell: bash
        run: |
          {
            echo "## Error real de la compilación"
            echo '```'
            grep -nE "error:|fatal error|undefined (reference|symbol)|FAILED:|What went wrong|Execution failed|not declared|no matching function" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir log completo de la compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Chequeo rápido de lint interno
        run: ./gradlew :app:lintDebug --no-daemon || true

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Kiu-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir APK release
        uses: actions/upload-artifact@v4
        with:
          name: Kiu-APK-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ---- 3) Release: al pushear un tag v* se publican los APK ----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Bajar APK debug
        uses: actions/download-artifact@v4
        with:
          name: Kiu-APK-debug
          path: dist

      - name: Bajar APK release
        uses: actions/download-artifact@v4
        with:
          name: Kiu-APK-release
          path: dist

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
